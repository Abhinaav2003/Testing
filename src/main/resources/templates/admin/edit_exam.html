<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit exam - Online Exam System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --ink: #101828;
            --muted: #475467;
            --paper: #f3f5f9;
            --surface: #ffffff;
            --brand: #3b3fd8;
            --brand-dark: #2b2fb0;
            --bad: #b42318;
            --line: #d9deea;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
            background: var(--paper);
            min-height: 100vh;
        }
        h1 { font-weight: 800; letter-spacing: -0.02em; }
        :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

        .page { padding: 1.5rem 0 2.5rem; }

        .form-card {
            background: var(--surface);
            border: 2px solid var(--ink);
            border-radius: 14px;
            padding: 1.5rem;
            max-width: 520px;
            margin-inline: auto;
        }
        .form-card h1 { font-size: 1.75rem; margin-bottom: 1.25rem; }

        .form-label { font-weight: 600; }
        .form-control {
            border: 1.5px solid var(--line);
            border-radius: 10px;
            padding: .75rem .9rem;
            font-size: 1rem; /* 16px stops iOS zooming on focus */
        }
        .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(59, 63, 216, .2); }
        .form-control.is-invalid { border-color: var(--bad); }
        .field-error { color: var(--bad); font-weight: 600; margin: .35rem 0 0; font-size: .95rem; }

        .btn-brand {
            background: var(--brand); color: #fff; font-weight: 600;
            padding: .8rem 1.2rem; border-radius: 10px; border: 0;
        }
        .btn-brand:hover { background: var(--brand-dark); color: #fff; }
        .btn-ghost {
            font-weight: 600; padding: .8rem 1.2rem; border-radius: 10px;
            border: 2px solid var(--ink); color: var(--ink); background: transparent;
        }
        .btn-ghost:hover { background: var(--ink); color: #fff; }

        .back-link { max-width: 520px; margin: 0 auto 1rem; }
        .back-link a { color: var(--brand); font-weight: 600; text-decoration: none; display: inline-block; padding: .25rem 0; }
        .back-link a:hover { text-decoration: underline; }

        /* Buttons: stacked and full-width on phones (main action on top), side by side from tablet up */
        .form-actions { display: flex; flex-direction: column-reverse; gap: .75rem; }
        @media (min-width: 576px) {
            .page { padding: 3rem 0; }
            .form-card { padding: 2rem; }
            .form-actions { flex-direction: row; justify-content: flex-end; }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<main class="page">
    <div class="container">

        <div class="back-link">
            <a th:href="@{/admin/manage-exams}"><i class="bi bi-arrow-left me-1"></i>Back to exams</a>
        </div>

        <div class="form-card">
            <h1>Edit exam</h1>

            <!-- Pre-filled using th:object -->
            <form th:action="@{/admin/exam/update/{id}(id=${exam.id})}" th:object="${exam}" method="post">

                <div class="mb-3">
                    <label for="title" class="form-label">Exam title</label>
                    <input type="text" class="form-control" id="title" th:field="*{title}"
                           th:errorclass="is-invalid" required>
                    <p th:if="${#fields.hasErrors('title')}" class="field-error" th:errors="*{title}"></p>
                </div>

                <div class="mb-4">
                    <label for="duration" class="form-label">Duration (minutes)</label>
                    <input type="number" class="form-control" id="duration" th:field="*{durationInMinutes}"
                           th:errorclass="is-invalid" min="1" inputmode="numeric" required>
                    <p th:if="${#fields.hasErrors('durationInMinutes')}" class="field-error" th:errors="*{durationInMinutes}"></p>
                </div>

                <div class="form-actions">
                    <a th:href="@{/admin/manage-exams}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-brand">Update exam</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
