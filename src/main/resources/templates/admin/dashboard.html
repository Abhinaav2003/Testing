<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - Online Exam System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --ink: #101828;
            --muted: #475467;
            --paper: #f3f5f9;
            --surface: #ffffff;
            --brand: #3b3fd8;
            --line: #d9deea;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
            background: var(--paper);
        }
        h1, h2, h3 { font-weight: 800; letter-spacing: -0.02em; }
        :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

        .page { padding: 1.5rem 0 2.5rem; }
        .page h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin-bottom: .25rem; }
        .page .sub { color: var(--muted); margin-bottom: 1.25rem; }

        /* Stat cards */
        .stat {
            background: var(--surface); border: 2px solid var(--ink); border-radius: 14px;
            padding: .9rem 1rem; height: 100%;
        }
        .stat-top { display: flex; justify-content: space-between; align-items: center; color: var(--brand); font-size: 1.3rem; }
        .stat-value { font-size: clamp(1.6rem, 6vw, 2.2rem); font-weight: 800; line-height: 1.1; margin-top: .25rem; }
        .stat-label { color: var(--muted); font-weight: 600; font-size: .95rem; }

        /* Panels */
        .panel {
            background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
            padding: 1rem; height: 100%;
        }
        .panel h2 { font-size: 1.15rem; margin-bottom: .75rem; }

        .chart-box { position: relative; height: 260px; } /* needed by Chart.js */
        .chart-empty { color: var(--muted); margin: 0; padding: 2rem 0; text-align: center; }

        .action-list { list-style: none; padding: 0; margin: 0; }
        .action-list li + li { border-top: 1px solid var(--line); }
        .action-list a {
            display: flex; align-items: center; gap: .75rem; min-height: 52px; /* easy to tap */
            color: var(--ink); text-decoration: none; font-weight: 600;
        }
        .action-list a:hover { color: var(--brand); }
        .action-list i { color: var(--brand); font-size: 1.2rem; }

        @media (min-width: 576px) {
            .page { padding: 2.5rem 0 3rem; }
            .panel { padding: 1.25rem; }
            .chart-box { height: 340px; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<main class="page">
    <div class="container">

        <h1>Welcome, Admin</h1>
        <p class="sub">Here is a summary of your platform.</p>

        <!-- Stats: 2 per row on phones, 4 on desktop -->
        <div class="row g-3">
            <div class="col-6 col-lg-3">
                <div class="stat">
                    <div class="stat-top"><i class="bi bi-people-fill" aria-hidden="true"></i></div>
                    <div class="stat-value" th:text="${totalStudents}">0</div>
                    <div class="stat-label">Students</div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="stat">
                    <div class="stat-top"><i class="bi bi-journal-text" aria-hidden="true"></i></div>
                    <div class="stat-value" th:text="${totalExams}">0</div>
                    <div class="stat-label">Exams</div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="stat">
                    <div class="stat-top"><i class="bi bi-question-circle-fill" aria-hidden="true"></i></div>
                    <div class="stat-value" th:text="${totalQuestions}">0</div>
                    <div class="stat-label">Questions</div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="stat">
                    <div class="stat-top"><i class="bi bi-card-checklist" aria-hidden="true"></i></div>
                    <div class="stat-value" th:text="${totalSubmissions}">0</div>
                    <div class="stat-label">Submissions</div>
                </div>
            </div>
        </div>

        <!-- Chart and quick actions -->
        <div class="row g-3 mt-1">
            <div class="col-lg-7">
                <div class="panel">
                    <h2>Exam submissions</h2>
                    <div class="chart-box" id="chartBox">
                        <canvas id="submissionsChart" role="img" aria-label="Bar chart of submissions per exam"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="panel">
                    <h2>Quick actions</h2>
                    <ul class="action-list">
                        <li><a th:href="@{/admin/manage-exams}"><i class="bi bi-pencil-square"></i>Manage exams</a></li>
                        <li><a th:href="@{/admin/students}"><i class="bi bi-people-fill"></i>Manage students</a></li>
                        <li><a th:href="@{/admin/exam/add}"><i class="bi bi-plus-circle-fill"></i>Create new exam</a></li>
                    </ul>
                </div>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    /*<![CDATA[*/

    const chartLabels = /*[[${chartLabels}]]*/ [];
    const chartData = /*[[${chartData}]]*/ [];

    if (chartLabels && chartLabels.length > 0) {
        new Chart(document.getElementById('submissionsChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: chartLabels,
                datasets: [{
                    label: '# of submissions',
                    data: chartData,
                    backgroundColor: 'rgba(59, 63, 216, 0.25)',
                    borderColor: 'rgba(59, 63, 216, 1)',
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } },
                    x: {
                        grid: { display: false },
                        ticks: { maxRotation: 45, autoSkip: true } // keeps long exam names readable on phones
                    }
                }
            }
        });
    } else {
        // Nothing to draw yet: show a short message instead of a blank box
        var box = document.getElementById('chartBox');
        box.style.height = 'auto';
        box.innerHTML = '<p class="chart-empty">No submissions yet. They will appear here once students take exams.</p>';
    }

    /*]]>*/
</script>

<script th:src="@{/js/live-refresh.js}"></script>

</body>
</html>
