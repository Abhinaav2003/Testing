<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage students - Online Exam System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --ink: #101828;
            --muted: #475467;
            --paper: #f3f5f9;
            --surface: #ffffff;
            --brand: #3b3fd8;
            --brand-dark: #2b2fb0;
            --bad: #b42318;
            --line: #d9deea;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
            background: var(--paper);
            min-height: 100vh;
        }
        h1, h2 { font-weight: 800; letter-spacing: -0.02em; }
        :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

        .page { padding: 1.5rem 0 2.5rem; }
        .page h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin-bottom: .25rem; }
        .page .sub { color: var(--muted); margin-bottom: 1.25rem; }

        .alert { border-radius: 10px; font-weight: 600; }

        /* One card per student */
        .student-card {
            background: var(--surface); border: 2px solid var(--ink); border-radius: 14px;
            padding: 1rem; height: 100%; display: flex; flex-direction: column;
        }
        .who { display: flex; align-items: center; gap: .75rem; margin-bottom: .75rem; min-width: 0; }
        .avatar {
            flex: none; width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
            border: 1px solid var(--line); background: var(--paper); color: var(--muted);
        }
        .who-text { min-width: 0; }
        .student-name { font-weight: 800; font-size: 1.1rem; margin: 0; overflow-wrap: anywhere; }
        .contact { color: var(--muted); margin: 0 0 1rem; display: grid; gap: .35rem; }
        .contact div { display: flex; gap: .5rem; align-items: baseline; overflow-wrap: anywhere; }
        .contact i { color: var(--brand); }
        .contact a { color: inherit; }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: auto; }
        .act {
            display: flex; align-items: center; justify-content: center; gap: .4rem;
            min-height: 44px; /* easy to tap */
            border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface);
            color: var(--ink); font-weight: 600; text-decoration: none; padding: .4rem .5rem; font: inherit; font-weight: 600;
        }
        .act:hover { border-color: var(--brand); color: var(--brand); }
        .act i { color: var(--brand); }
        .act-danger { color: var(--bad); border-color: #f0c4bf; }
        .act-danger i { color: var(--bad); }
        .act-danger:hover { background: #fdecea; border-color: var(--bad); color: var(--bad); }

        .empty {
            background: var(--surface); border: 2px dashed var(--line); border-radius: 14px;
            padding: 2rem 1rem; text-align: center; color: var(--muted);
        }
        .empty i { font-size: 2rem; }

        /* Modal */
        .modal-content { border: 2px solid var(--ink); border-radius: 14px; }
        .modal-title { font-weight: 800; }
        .form-label { font-weight: 600; }
        .form-control {
            border: 1.5px solid var(--line); border-radius: 10px; padding: .75rem .9rem;
            font-size: 1rem; /* 16px stops iOS zooming on focus */
        }
        .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(59, 63, 216, .2); }
        .btn-brand { background: var(--brand); color: #fff; font-weight: 600; padding: .7rem 1.2rem; border-radius: 10px; border: 0; }
        .btn-brand:hover { background: var(--brand-dark); color: #fff; }
        .btn-ghost { font-weight: 600; padding: .7rem 1.2rem; border-radius: 10px; border: 2px solid var(--ink); color: var(--ink); background: transparent; }
        .btn-ghost:hover { background: var(--ink); color: #fff; }

        /* Modal buttons stack on phones, main action on top */
        .modal-footer { flex-direction: column-reverse; align-items: stretch; gap: .5rem; }
        .modal-footer > * { margin: 0; }
        @media (min-width: 576px) {
            .page { padding: 2.5rem 0 3rem; }
            .student-card { padding: 1.25rem; }
            .modal-footer { flex-direction: row; justify-content: flex-end; }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<main class="page">
    <div class="container">

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Error:</strong> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="status">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <h1>Manage students</h1>
        <p class="sub">Reset passwords and manage all registered students.</p>

        <div class="row g-3">
            <div class="col-12 col-md-6 col-xl-4" th:each="student : ${students}">
                <div class="student-card">

                    <div class="who">
                        <img th:if="${student.profilePicUrl != null}"
                             th:src="@{${student.profilePicUrl}}" alt="" class="avatar">
                        <svg th:if="${student.profilePicUrl == null}"
                             xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor"
                             class="avatar" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                            <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
                        </svg>
                        <div class="who-text">
                            <p class="student-name" th:text="${student.fullName}">Student name</p>
                        </div>
                    </div>

                    <div class="contact">
                        <div><i class="bi bi-envelope"></i><span th:text="${student.username}">student@example.com</span></div>
                        <div th:if="${student.mobileNumber != null and !#strings.isEmpty(student.mobileNumber)}">
                            <i class="bi bi-telephone"></i>
                            <a th:href="|tel:${student.mobileNumber}|" th:text="${student.mobileNumber}">+123456789</a>
                        </div>
                    </div>

                    <div class="actions">
                        <!-- Opens the reset password modal -->
                        <button type="button" class="act" data-bs-toggle="modal" data-bs-target="#resetPasswordModal"
                                th:attr="data-student-id=${student.id}, data-student-name=${student.username}">
                            <i class="bi bi-key-fill"></i>Reset password
                        </button>
                        <a th:href="@{/admin/student/delete/{id}(id=${student.id})}" class="act act-danger"
                           onclick="return confirm('Are you sure you want to delete this student? This will also delete ALL of their exam results and answers. This action cannot be undone.');">
                            <i class="bi bi-trash-fill"></i>Delete
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="empty" th:if="${#lists.isEmpty(students)}">
            <i class="bi bi-person-x"></i>
            <p class="mb-0 mt-2">No student accounts have been created yet.</p>
        </div>

    </div>
</main>

<!-- Password reset modal -->
<div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-labelledby="resetPasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="resetPasswordModalLabel">Reset password</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/admin/student/reset-password}" method="post">
                <div class="modal-body">
                    <p>You are resetting the password for: <strong id="studentNameLabel" style="overflow-wrap:anywhere;"></strong></p>

                    <input type="hidden" id="modalStudentId" name="userId" value="">

                    <div class="mb-1">
                        <label for="newPassword" class="form-label">New password</label>
                        <input type="password" class="form-control" id="newPassword" name="newPassword"
                               autocomplete="new-password" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-brand">Reset password</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var resetPasswordModal = document.getElementById('resetPasswordModal');

    // Fill in the chosen student each time the modal opens, and start with an empty password box
    resetPasswordModal.addEventListener('show.bs.modal', function (event) {
        var button = event.relatedTarget;
        resetPasswordModal.querySelector('#modalStudentId').value = button.getAttribute('data-student-id');
        resetPasswordModal.querySelector('#studentNameLabel').textContent = button.getAttribute('data-student-name');
        resetPasswordModal.querySelector('#newPassword').value = '';
    });

    // Put the cursor in the password box as soon as the modal is open
    resetPasswordModal.addEventListener('shown.bs.modal', function () {
        resetPasswordModal.querySelector('#newPassword').focus();
    });
</script>
</body>
</html>
