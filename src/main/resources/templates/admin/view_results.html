<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Exam Results - Online Exam System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        :root {
            --ink: #101828;
            --muted: #475467;
            --paper: #f3f5f9;
            --surface: #fff;
            --brand: #3b3fd8;
            --ok: #12805c;
            --bad: #b42318;
            --line: #d9deea;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--paper);
            min-height: 100vh;
        }

        .page {
            padding: 1.5rem 0 3rem;
        }

        .back-link a {
            color: var(--brand);
            font-weight: 600;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .page h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 800;
            margin: 1rem 0 .4rem;
            overflow-wrap: anywhere;
        }

        .sub {
            color: var(--muted);
            margin-bottom: 1.5rem;
        }

        .results-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.25rem;
        }

        .result-count {
            font-weight: 700;
        }

        .sort-control {
            display: flex;
            align-items: center;
            gap: .6rem;
            flex-wrap: wrap;
        }

        .sort-control label {
            font-size: .9rem;
            font-weight: 600;
        }

        .sort-control select {
            width: auto;
            min-width: 210px;
            max-width: 100%;
        }

        .result-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 1rem;
            height: 100%;
            box-shadow: 0 3px 12px rgba(16, 24, 40, .04);
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .result-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(16, 24, 40, .08);
        }

        .result-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: .75rem;
        }

        .student-name {
            font-size: 1.05rem;
            font-weight: 800;
            margin: 0;
            overflow-wrap: anywhere;
        }

        .student-username {
            color: var(--muted);
            font-size: .9rem;
            margin: .3rem 0 0;
            overflow-wrap: anywhere;
        }

        .pct {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            font-weight: 800;
            padding: .35rem .7rem;
            border-radius: 999px;
            white-space: nowrap;
        }

        .pct.pass {
            background: #e8f6f0;
            color: var(--ok);
        }

        .pct.fail {
            background: #fdecea;
            color: var(--bad);
        }

        .pct.na {
            background: #eef0f5;
            color: var(--muted);
        }

        .result-meta {
            display: flex;
            flex-direction: column;
            gap: .8rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: .9rem;
        }

        .result-meta i {
            color: var(--brand);
            margin-right: .4rem;
        }

        .result-meta strong {
            color: var(--ink);
        }

        .duration {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            background: #eef2ff;
            color: #3730a3;
            border-radius: 7px;
            padding: .25rem .5rem;
            font-weight: 700;
        }

        .duration i {
            color: #3730a3;
        }

        .empty {
            background: var(--surface);
            border: 2px dashed var(--line);
            border-radius: 14px;
            padding: 2.5rem 1rem;
            text-align: center;
            color: var(--muted);
        }

        .empty i {
            font-size: 2.5rem;
            color: var(--brand);
        }

        @media (min-width: 576px) {
            .page {
                padding-top: 2rem;
            }

            .result-card {
                padding: 1.25rem;
            }
        }

        @media (max-width: 480px) {
            .sort-control {
                width: 100%;
                align-items: stretch;
                flex-direction: column;
            }

            .sort-control select {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .result-card {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments :: navbar}"></div>

    <main class="page">
        <div class="container">

            <div class="back-link mb-3">
                <a th:href="@{/admin/manage-exams}">
                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
                    Back to exams
                </a>
            </div>

            <h1 th:text="${exam.title}">Exam Results</h1>

            <p class="sub">
                View student scores, percentages, and quiz duration.
            </p>

            <!-- Sorting toolbar -->
            <div class="results-toolbar"
                 th:unless="${#lists.isEmpty(results)}">

                <div class="result-count">
                    <i class="bi bi-people-fill me-2"
                       style="color: var(--brand)"
                       aria-hidden="true"></i>

                    Total submissions:
                    <span th:text="${#lists.size(results)}">0</span>
                </div>

                <a th:href="@{/admin/results/{id}/export(id=${exam.id})}"
                   class="btn btn-success fw-semibold">
                    <i class="bi bi-file-earmark-excel-fill me-1" aria-hidden="true"></i>
                    Download Excel
                </a>

                <div class="sort-control">
                    <label for="sortResults">
                        <i class="bi bi-sort-down me-1" aria-hidden="true"></i>
                        Sort results:
                    </label>

                    <select id="sortResults" class="form-select">
                        <option value="default">Default order</option>
                        <option value="marks-desc">Marks: Highest to Lowest</option>
                        <option value="marks-asc">Marks: Lowest to Highest</option>
                        <option value="time-asc">Time Taken: Fastest First</option>
                        <option value="time-desc">Time Taken: Slowest First</option>
                    </select>
                </div>
            </div>

            <!-- Results cards -->
            <div id="resultsContainer"
                 class="row g-3"
                 th:unless="${#lists.isEmpty(results)}">

                <div class="result-item col-12 col-md-6 col-xl-4"
                     th:each="result : ${results}"
                     th:attr="data-score=${result.scoreAchieved},
                              data-duration=${result.durationSeconds != null and result.durationSeconds > 0 ? result.durationSeconds : -1}">

                    <article class="result-card">

                        <div class="result-top">
                            <div>
                                <p class="student-name"
                                   th:text="${result.student.fullName}">
                                    Student Name
                                </p>

                                <p class="student-username"
                                   th:text="${result.student.username}">
                                    student
                                </p>
                            </div>

                            <th:block
                                th:if="${result.totalMarks > 0}"
                                th:with="percentage=${result.scoreAchieved * 100.0 / result.totalMarks}">

                                <span class="pct"
                                      th:classappend="${percentage >= 50 ? ' pass' : ' fail'}">

                                    <i class="bi"
                                       th:classappend="${percentage >= 50 ? ' bi-check-circle-fill' : ' bi-x-circle-fill'}"
                                       aria-hidden="true"></i>

                                    <span th:text="${#numbers.formatDecimal(percentage, 1, 1) + '%'}">
                                        75.0%
                                    </span>
                                </span>
                            </th:block>

                            <span class="pct na"
                                  th:if="${result.totalMarks <= 0}">
                                N/A
                            </span>
                        </div>

                        <div class="result-meta">

                            <div>
                                <i class="bi bi-award-fill" aria-hidden="true"></i>
                                <strong>Marks:</strong>

                                <strong th:text="${result.scoreAchieved}">15</strong>
                                /
                                <span th:text="${result.totalMarks}">20</span>
                            </div>

                            <div>
                                <i class="bi bi-stopwatch-fill" aria-hidden="true"></i>
                                <strong>Time Taken:</strong>

                                <span class="duration"
                                      th:if="${result.durationSeconds != null and result.durationSeconds > 0}"
                                      th:text="${(result.durationSeconds / 60) + ' min ' + (result.durationSeconds % 60) + ' sec'}">
                                    2 min 5 sec
                                </span>

                                <span th:if="${result.durationSeconds == null or result.durationSeconds <= 0}">
                                    Not available
                                </span>
                            </div>

                        </div>
                    </article>
                </div>
            </div>

            <!-- Empty state -->
            <div class="empty"
                 th:if="${#lists.isEmpty(results)}">

                <i class="bi bi-clipboard-data" aria-hidden="true"></i>

                <h2 class="h5 mt-3">No results available</h2>

                <p class="mb-0">
                    No student has submitted this exam yet.
                </p>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const sortSelect = document.getElementById("sortResults");
            const container = document.getElementById("resultsContainer");

            if (!sortSelect || !container) {
                return;
            }

            // Save the original order for the Default option.
            const originalItems = Array.from(
                container.querySelectorAll(".result-item")
            );

            function sortResults() {
                const selectedSort = sortSelect.value;
                const items = Array.from(originalItems);

                items.sort(function (a, b) {
                    const scoreA = Number(a.dataset.score);
                    const scoreB = Number(b.dataset.score);

                    const durationA = Number(a.dataset.duration);
                    const durationB = Number(b.dataset.duration);

                    if (selectedSort === "marks-desc") {
                        return scoreB - scoreA;
                    }

                    if (selectedSort === "marks-asc") {
                        return scoreA - scoreB;
                    }

                    if (selectedSort === "time-asc") {
                        // Unknown durations always appear last.
                        if (durationA < 0 && durationB >= 0) return 1;
                        if (durationB < 0 && durationA >= 0) return -1;

                        if (durationA < 0 && durationB < 0) return 0;

                        return durationA - durationB;
                    }

                    if (selectedSort === "time-desc") {
                        // Unknown durations always appear last.
                        if (durationA < 0 && durationB >= 0) return 1;
                        if (durationB < 0 && durationA >= 0) return -1;

                        if (durationA < 0 && durationB < 0) return 0;

                        return durationB - durationA;
                    }

                    // Restore the original server-rendered order.
                    return originalItems.indexOf(a) -
                           originalItems.indexOf(b);
                });

                items.forEach(function (item) {
                    container.appendChild(item);
                });
            }

            sortSelect.addEventListener("change", sortResults);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
