<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account - Online Exam System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --ink: #101828;
            --muted: #475467;
            --paper: #f3f5f9;
            --surface: #ffffff;
            --brand: #3b3fd8;
            --brand-dark: #2b2fb0;
            --bad: #b42318;
            --line: #d9deea;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
            background: var(--paper);
            min-height: 100vh;
        }
        h1 { font-weight: 800; letter-spacing: -0.02em; }
        :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

        .auth-wrap { padding: 1.5rem 0 2.5rem; }

        .auth-card {
            background: var(--surface);
            border: 2px solid var(--ink);
            border-radius: 14px;
            padding: 1.5rem;
            max-width: 520px;
            margin-inline: auto;
        }
        .auth-card h1 { font-size: 1.75rem; margin-bottom: .25rem; }
        .auth-card .sub { color: var(--muted); margin-bottom: 1.25rem; }

        .form-label { font-weight: 600; }
        .form-text { color: var(--muted); }
        .form-control {
            border: 1.5px solid var(--line);
            border-radius: 10px;
            padding: .75rem .9rem;
            font-size: 1rem; /* 16px stops iOS zooming on focus */
        }
        .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(59, 63, 216, .2); }
        .form-control.is-invalid { border-color: var(--bad); }
        .field-error { color: var(--bad); font-weight: 600; margin: .35rem 0 0; font-size: .95rem; }

        .input-group .form-control { border-right: 0; border-radius: 10px 0 0 10px; }
        .toggle-pw {
            border: 1.5px solid var(--line); border-left: 0; background: var(--surface);
            border-radius: 0 10px 10px 0; color: var(--muted);
            min-width: 48px; /* easy to tap */
        }
        .toggle-pw:hover { color: var(--ink); }
        .input-group:focus-within .form-control,
        .input-group:focus-within .toggle-pw { border-color: var(--brand); }

        /* Profile picture picker with live preview */
        .pic-row { display: flex; align-items: center; gap: .9rem; }
        .pic-preview {
            flex: none; width: 56px; height: 56px; border-radius: 50%;
            border: 2px solid var(--ink); background: var(--paper);
            display: grid; place-items: center; color: var(--muted); font-size: 1.6rem; overflow: hidden;
        }
        .pic-preview img { width: 100%; height: 100%; object-fit: cover; }
        .pic-row .flex-grow-1 { min-width: 0; } /* stops the file input overflowing on narrow phones */

        .btn-brand {
            background: var(--brand); color: #fff; font-weight: 600;
            padding: .8rem 1.2rem; border-radius: 10px; border: 0;
        }
        .btn-brand:hover { background: var(--brand-dark); color: #fff; }

        .alert { border-radius: 10px; font-weight: 600; }
        .alert a { color: inherit; text-decoration: underline; }
        .auth-foot { text-align: center; margin: 1.25rem 0 0; color: var(--muted); }
        .auth-foot a, .back-link a { color: var(--brand); font-weight: 600; }
        .back-link { max-width: 520px; margin: 0 auto 1rem; }
        .back-link a { text-decoration: none; display: inline-block; padding: .25rem 0; }
        .back-link a:hover { text-decoration: underline; }

        @media (min-width: 576px) {
            .auth-wrap { padding: 3rem 0; }
            .auth-card { padding: 2rem; }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<main class="auth-wrap">
    <div class="container">

        <div class="back-link">
            <a th:href="@{/}"><i class="bi bi-arrow-left me-1"></i>Back to home</a>
        </div>

        <div class="auth-card">
            <h1>Create your account</h1>
            <p class="sub">Sign up as a student to take exams and see your results.</p>

            <div th:if="${param.success}" class="alert alert-success" role="status">
                <i class="bi bi-check-circle-fill me-2"></i>Account created. You can now <a th:href="@{/login}">log in</a>.
            </div>

            <form th:action="@{/register}" th:object="${user}" method="post" enctype="multipart/form-data">

                <div class="mb-3">
                    <label for="fullName" class="form-label">Full name</label>
                    <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                           th:errorclass="is-invalid" autocomplete="name">
                    <p th:if="${#fields.hasErrors('fullName')}" class="field-error" th:errors="*{fullName}"></p>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">Email</label>
                    <input type="email" class="form-control" id="username" th:field="*{username}"
                           th:errorclass="is-invalid" autocomplete="email" autocapitalize="none" required aria-describedby="emailHelp">
                    <div id="emailHelp" class="form-text">You will use this email to log in.</div>
                    <p th:if="${#fields.hasErrors('username')}" class="field-error" th:errors="*{username}"></p>
                </div>

                <div class="mb-3">
                    <label for="mobileNumber" class="form-label">Mobile number</label>
                    <input type="tel" class="form-control" id="mobileNumber" th:field="*{mobileNumber}"
                           th:errorclass="is-invalid" autocomplete="tel">
                    <p th:if="${#fields.hasErrors('mobileNumber')}" class="field-error" th:errors="*{mobileNumber}"></p>
                </div>

                <div class="mb-3">
                    <label for="profilePicFile" class="form-label">Profile picture</label>
                    <div class="pic-row">
                        <div class="pic-preview" id="picPreview" aria-hidden="true"><i class="bi bi-person-fill"></i></div>
                        <div class="flex-grow-1">
                            <input type="file" class="form-control" id="profilePicFile" name="profilePicFile"
                                   accept="image/png, image/jpeg" aria-describedby="picHelp">
                            <div id="picHelp" class="form-text">PNG or JPG.</div>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" th:field="*{password}"
                               th:errorclass="is-invalid" autocomplete="new-password" required>
                        <button type="button" class="toggle-pw" id="togglePw"
                                aria-label="Show password" aria-pressed="false">
                            <i class="bi bi-eye" id="togglePwIcon"></i>
                        </button>
                    </div>
                    <p th:if="${#fields.hasErrors('password')}" class="field-error" th:errors="*{password}"></p>
                </div>

                <button type="submit" class="btn btn-brand w-100">Create account</button>
            </form>

            <p class="auth-foot">
                Already have an account? <a th:href="@{/login}">Log in</a>
            </p>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        // Show / hide password
        var pw = document.getElementById('password');
        var btn = document.getElementById('togglePw');
        var icon = document.getElementById('togglePwIcon');
        btn.addEventListener('click', function () {
            var show = pw.type === 'password';
            pw.type = show ? 'text' : 'password';
            icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
            btn.setAttribute('aria-pressed', show);
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });

        // Live preview of the chosen profile picture
        var file = document.getElementById('profilePicFile');
        var preview = document.getElementById('picPreview');
        var fallback = preview.innerHTML;
        file.addEventListener('change', function () {
            var f = file.files && file.files[0];
            if (!f) { preview.innerHTML = fallback; return; }
            var img = document.createElement('img');
            img.alt = '';
            img.src = URL.createObjectURL(f);
            img.onload = function () { URL.revokeObjectURL(img.src); };
            preview.innerHTML = '';
            preview.appendChild(img);
        });
    })();
</script>
</body>
</html>
