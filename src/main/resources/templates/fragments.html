<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Fragments</title>
</head>
<body>

<!--
  Only the <nav> below is inserted by th:replace="~{fragments :: navbar}".
  Its CSS and JS therefore live INSIDE the fragment: anything in this file's
  <head> or after </nav> is never sent to the page that uses it.
  Each page must still load the Bootstrap JS bundle for the mobile menu and dropdown.
-->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark site-nav" aria-label="Main navigation">

    <style>
        .site-nav {
            --ink: #101828;
            --brand: #3b3fd8;
            --brand-dark: #2b2fb0;
            background: var(--ink);
            padding-block: .5rem;
        }
        .site-nav .navbar-brand {
            font-weight: 800; letter-spacing: -0.01em; font-size: 1.15rem;
            white-space: normal; /* lets a long name wrap on small phones */
        }
        .site-nav .nav-link {
            color: #c7cde0; font-weight: 600; border-radius: 8px;
            padding: .7rem .8rem; /* comfortable tap size */
        }
        .site-nav .nav-link:hover { color: #fff; background: rgba(255, 255, 255, .08); }
        .site-nav .nav-link.active { color: #fff; background: var(--brand); }
        .site-nav .nav-link:focus-visible,
        .site-nav .navbar-toggler:focus-visible,
        .site-nav .dropdown-item:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

        .site-nav .navbar-profile-pic {
            width: 30px; height: 30px; border-radius: 50%;
            object-fit: cover; margin-right: 8px; border: 1px solid #ddd;
            background: #fff; vertical-align: middle;
        }
        .site-nav .user-name {
            display: inline-block; max-width: 12ch; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; vertical-align: middle;
        }
        .site-nav .dropdown-menu { border-radius: 12px; padding: .5rem; min-width: 12rem; }
        .site-nav .dropdown-header { padding: .25rem .75rem; color: #475467; }
        .site-nav .dropdown-item { border-radius: 8px; font-weight: 600; padding-block: .6rem; }
        .site-nav form.logout-form { margin: 0; }
        .site-nav form.logout-form .dropdown-item { width: 100%; text-align: left; background: none; border: 0; }

        /* Create account is the main action for guests */
        .site-nav .nav-cta { background: var(--brand); color: #fff; }
        .site-nav .nav-cta:hover { background: var(--brand-dark); color: #fff; }

        /* Phones and tablets: menu is stacked, so give it some room */
        @media (max-width: 991.98px) {
            .site-nav .navbar-collapse { padding-top: .5rem; }
            .site-nav .nav-cta { text-align: center; margin-top: .25rem; }
            .site-nav .dropdown-menu { background: rgba(255, 255, 255, .06); border: 0; }
            .site-nav .dropdown-item,
            .site-nav .dropdown-header { color: #c7cde0; }
            .site-nav .dropdown-item:hover { background: rgba(255, 255, 255, .08); color: #fff; }
            .site-nav .dropdown-divider { border-color: rgba(255, 255, 255, .15); }
        }
    </style>

    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Online Exam System</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <!-- Admin links -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/manage-exams}">Manage exams</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/students}">Manage students</a>
                </li>

                <!-- Student links -->
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/student/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/student/my-results}">My results</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto align-items-lg-center">
                <!-- Guests -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">Log in</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link nav-cta" th:href="@{/register}">Create account</a>
                </li>

                <!-- Logged-in users -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">

                        <img th:if="${globalProfilePicUrl != null}"
                             th:src="@{${globalProfilePicUrl}}"
                             alt="" class="navbar-profile-pic">

                        <svg th:if="${globalProfilePicUrl == null}"
                             xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                             class="navbar-profile-pic" viewBox="0 0 16 16" aria-hidden="true"
                             style="color:#475467;">
                            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                            <path fill-rule="evenodd"
                                  d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
                        </svg>

                        <span class="user-name" sec:authentication="name"></span>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                        <li>
                            <span class="dropdown-header" sec:authorize="hasRole('ADMIN')">Signed in as admin</span>
                            <span class="dropdown-header" sec:authorize="hasRole('STUDENT')">Signed in as student</span>
                        </li>
                        <li sec:authorize="hasRole('STUDENT')">
                            <a class="dropdown-item" th:href="@{/student/profile}">My profile</a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <!-- A real button in a form: works without JavaScript and sends the CSRF token -->
                            <form th:action="@{/logout}" method="post" class="logout-form">
                                <button type="submit" class="dropdown-item">Log out</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>

    <script>
        // Highlight the link for the current page
        (function () {
            var path = window.location.pathname.replace(/\/+$/, '') || '/';
            document.querySelectorAll('.site-nav .navbar-nav.me-auto .nav-link').forEach(function (a) {
                var href = (a.getAttribute('href') || '').split(';')[0].split('?')[0].replace(/\/+$/, '') || '/';
                if (path === href || path.indexOf(href + '/') === 0) {
                    a.classList.add('active');
                    a.setAttribute('aria-current', 'page');
                }
            });
        })();
    </script>
</nav>

</body>
</html>
