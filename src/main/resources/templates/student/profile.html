<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My profile - Online Exam System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --ink: #101828;
            --muted: #475467;
            --paper: #f3f5f9;
            --surface: #ffffff;
            --brand: #3b3fd8;
            --brand-dark: #2b2fb0;
            --bad: #b42318;
            --line: #d9deea;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
            background: var(--paper);
            min-height: 100vh;
        }
        h1, h2 { font-weight: 800; letter-spacing: -0.02em; }
        :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

        .page { padding: 1.5rem 0 2.5rem; }
        .page h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin-bottom: 1.25rem; }

        .alert { border-radius: 10px; font-weight: 600; }

        .panel {
            background: var(--surface); border: 2px solid var(--ink); border-radius: 14px;
            padding: 1.25rem;
        }
        .panel h2 { font-size: 1.2rem; margin-bottom: 1rem; }

        /* Picture card */
        .pic-card { text-align: center; }
        .profile-pic {
            width: 112px; height: 112px; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--line); background: var(--surface); color: var(--muted);
            margin-bottom: .75rem;
        }
        .pic-card .name { font-weight: 800; font-size: 1.25rem; margin: 0; overflow-wrap: anywhere; }
        .pic-card .email { color: var(--muted); margin: .15rem 0 1.25rem; overflow-wrap: anywhere; }
        .pic-card form { text-align: left; }

        .form-label { font-weight: 600; }
        .form-text { color: var(--muted); }
        .form-control {
            border: 1.5px solid var(--line);
            border-radius: 10px;
            padding: .75rem .9rem;
            font-size: 1rem; /* 16px stops iOS zooming on focus */
        }
        .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(59, 63, 216, .2); }
        .form-control:disabled, .form-control[readonly] { background: var(--paper); color: var(--muted); }
        .form-control.is-invalid { border-color: var(--bad); }
        .field-error { color: var(--bad); font-weight: 600; margin: .35rem 0 0; font-size: .95rem; }

        .btn-brand {
            background: var(--brand); color: #fff; font-weight: 600;
            padding: .8rem 1.2rem; border-radius: 10px; border: 0; min-height: 48px;
        }
        .btn-brand:hover { background: var(--brand-dark); color: #fff; }

        @media (min-width: 576px) {
            .page { padding: 2.5rem 0 3rem; }
            .panel { padding: 1.5rem; }
            .profile-pic { width: 140px; height: 140px; }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<main class="page">
    <div class="container">

        <h1>My profile</h1>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="status">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Error:</strong> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row g-3 g-lg-4">

            <!-- Picture -->
            <div class="col-lg-4">
                <div class="panel pic-card">
                    <img th:if="${student.profilePicUrl != null}"
                         th:src="@{${student.profilePicUrl}}" alt="Your profile picture" class="profile-pic">
                    <svg th:if="${student.profilePicUrl == null}"
                         xmlns="http://www.w3.org/2000/svg" width="140" height="140" fill="currentColor"
                         class="profile-pic" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
                    </svg>

                    <p class="name" th:text="${student.fullName}">Student name</p>
                    <p class="email" th:text="${student.username}">student@email.com</p>

                    <form th:action="@{/student/profile/update-picture}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="profilePicFile" class="form-label">Change picture</label>
                            <input type="file" class="form-control" id="profilePicFile" name="profilePicFile"
                                   accept="image/png, image/jpeg" required aria-describedby="picHelp">
                            <div id="picHelp" class="form-text">PNG or JPG.</div>
                        </div>
                        <button type="submit" class="btn btn-brand w-100">Upload new picture</button>
                    </form>
                </div>
            </div>

            <!-- Details and password -->
            <div class="col-lg-8">

                <div class="panel mb-3 mb-lg-4">
                    <h2>Edit profile details</h2>
                    <form th:action="@{/student/profile/update-details}" th:object="${student}" method="post">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full name</label>
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                                   th:errorclass="is-invalid" autocomplete="name" required>
                            <p th:if="${#fields.hasErrors('fullName')}" class="field-error" th:errors="*{fullName}"></p>
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Email (login)</label>
                            <input type="email" class="form-control" id="username" th:field="*{username}" readonly disabled
                                   aria-describedby="emailHelp">
                            <div id="emailHelp" class="form-text">Email cannot be changed.</div>
                        </div>
                        <div class="mb-4">
                            <label for="mobileNumber" class="form-label">Mobile number</label>
                            <input type="tel" class="form-control" id="mobileNumber" th:field="*{mobileNumber}"
                                   th:errorclass="is-invalid" autocomplete="tel">
                            <p th:if="${#fields.hasErrors('mobileNumber')}" class="field-error" th:errors="*{mobileNumber}"></p>
                        </div>
                        <button type="submit" class="btn btn-brand w-100">Save changes</button>
                    </form>
                </div>

                <div class="panel">
                    <h2>Change password</h2>
                    <form id="passwordForm" th:action="@{/student/profile/update-password}" method="post">
                        <div class="mb-3">
                            <label for="oldPassword" class="form-label">Old password</label>
                            <input type="password" class="form-control" id="oldPassword" name="oldPassword"
                                   autocomplete="current-password" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New password</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword"
                                   autocomplete="new-password" required>
                        </div>
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Confirm new password</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                   autocomplete="new-password" required>
                        </div>
                        <button type="submit" class="btn btn-brand w-100">Update password</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Tell the student right away if the two new passwords differ (the server still checks too)
    (function () {
        var next = document.getElementById('newPassword');
        var confirmField = document.getElementById('confirmPassword');
        function check() {
            confirmField.setCustomValidity(
                confirmField.value && confirmField.value !== next.value ? 'The new passwords do not match.' : ''
            );
        }
        next.addEventListener('input', check);
        confirmField.addEventListener('input', check);
    })();
</script>
</body>
</html>
