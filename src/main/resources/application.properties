spring.application.name=online-exam
server.port=${PORT:8080}

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quizdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:quiz_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YourStrongPassword123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File uploads
file.upload-dir=./uploads